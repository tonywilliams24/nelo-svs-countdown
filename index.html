<!DOCTYPE html>
<html>
<head>
  <title>!!! COUNTDOWN TO SVS BATTLE PHASE !!!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(0px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(2px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    @keyframes slide {
      0% { opacity: 0; transform: translateX(100px); }
      10% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-100px); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 85, 255, 0.5), inset 0 0 20px rgba(0, 85, 255, 0.1); }
      50% { box-shadow: 0 0 40px rgba(0, 85, 255, 0.8), inset 0 0 30px rgba(0, 85, 255, 0.2); }
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-family: "Arial Black", "Comic Sans MS", sans-serif;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .carousel-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .carousel-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: slide 12s infinite ease-in-out;
    }

    .carousel-slide:nth-child(1) {
      background-image: url('file:///Users/tony/Downloads/ws中型城镇登录loading_1920x1080.jpg');
      animation-delay: 0s;
    }

    .carousel-slide:nth-child(2) {
      background-image: url('file:///Users/tony/Downloads/MV5BNDA4ODc2ZDUtNWUwZC00ZjFiLWI2MGQtMGMzYWQwNTgzODU4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg');
      animation-delay: 12s;
    }

    .carousel-slide:nth-child(3) {
      background-image: url('file:///Users/tony/Downloads/unnamed.png');
      animation-delay: 24s;
    }

    .carousel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 4rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 0 0 30px 0;
      color: #00d4ff;
      text-shadow: 0 0 20px #00d4ff, 0 0 40px #0055ff;
      animation: shake 0.5s infinite;
    }

    .pfp-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 30px 0 40px 0;
      flex-wrap: wrap;
    }

    .pfp {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 5px solid #00d4ff;
      box-shadow: 0 0 20px #00d4ff, 0 0 40px #0055ff;
      overflow: hidden;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .pfp:hover {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 0 30px #00d4ff, 0 0 60px #0055ff;
    }

    #timer {
      font-size: 5rem;
      font-weight: bold;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 85, 255, 0.2));
      color: #00ff88;
      border: 4px solid #00d4ff;
      padding: 30px 50px;
      margin: 30px 0;
      display: inline-block;
      border-radius: 15px;
      font-family: 'Courier New', monospace;
      animation: glow 2s ease-in-out infinite;
      text-shadow: 0 0 10px #00ff88;
    }

    .joke-box {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 3px solid #00d4ff;
      border-radius: 15px;
      padding: 25px;
      margin-top: 30px;
      font-size: 1.5rem;
      backdrop-filter: blur(10px);
      max-width: 600px;
    }

    button {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00d4ff, #0055ff);
      color: #000;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    button:hover {
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-slide"></div>
    <div class="carousel-slide"></div>
    <div class="carousel-slide"></div>
    <div class="carousel-overlay"></div>
  </div>

  <div class="content">
    <h1>⚔️ COUNTDOWN TO SVS BATTLE PHASE ⚔️</h1>

    <div class="pfp-container">
      <img src="file:///Users/tony/Desktop/Screenshot 2026-07-30 at 5.02.01 PM.png" alt="PFP 1" class="pfp">
      <img src="file:///Users/tony/Desktop/Screenshot 2026-07-30 at 5.01.53 PM.png" alt="PFP 2" class="pfp">
    </div>

    <div id="timer">LOADING...</div>

    <div class="joke-box">
      <div id="joke">Click the button for a dad joke while you wait!</div>
      <button onclick="getJoke()">👉 GET DAD JOKE 👈</button>
    </div>
  </div>

  <script>
    // Target date: August 15, 2026 10:00 UTC
    const target = new Date("2026-08-15T10:00:00Z").getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById("timer").innerText = "🔥 SVS BATTLE PHASE STARTED! 🔥";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("timer").innerText = `${d}D : ${h}H : ${m}M : ${s}S`;
    }, 1000);

    const jokes = [
      "Why don't scientists trust atoms? Because they make up everything!",
      "What do you call a factory that makes okay products? A satisfactory.",
      "How do you organize a space party? You planet.",
      "Why did the scarecrow win an award? Because he was outstanding in his field!",
      "I'm reading a book on anti-gravity. I just can't put it down!",
      "What do you call a fake noodle? An impasta.",
      "Why do mushrooms get invited to all the parties? Because they are fun-ghis!",
      "Want to hear a joke about construction? I'm still working on it.",
      "Why did the gamer go to the doctor? They had a console-ation needed!",
      "What's a gamer's favorite snack? Byte-sized pieces!"
    ];

    let lastIndex = -1;
    function getJoke() {
      let index = Math.floor(Math.random() * jokes.length);
      while(index === lastIndex) {
        index = Math.floor(Math.random() * jokes.length);
      }
      lastIndex = index;
      document.getElementById("joke").innerText = jokes[index];
    }
  </script>

</body>
</html>
