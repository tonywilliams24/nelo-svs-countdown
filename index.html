<!DOCTYPE html>
<html>
<head>
  <title>Countdown to SVS for Nelo</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20vh; background: #111; color: #fff; }
    h1 { font-size: 2.5rem; }
    #timer { font-size: 3rem; margin-top: 20px; color: #00ffcc; }
  </style>
</head>
<body>
  <h1>Countdown to SVS for Nelo</h1>
  <div id="timer">Loading...</div>

  <script>
    const target = new Date("2026-08-10T00:00:00Z").getTime();
    setInterval(() => {
      const now = new Date().getTime();
      const diff = target - now;
      if (diff <= 0) {
        document.getElementById("timer").innerText = "The time has come!";
        return;
      }
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);
      document.getElementById("timer").innerText = `${d}d ${h}h ${m}m ${s}s`;
    }, 1000);
  </script>
</body>
</html>
